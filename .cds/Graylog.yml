name: Graylog
version: v2.0
workflow:

  setup-graylog:
    pipeline: pom.version
    application: graylog2-server

  build-graylog:
    depends_on:
    - setup-graylog
    when:
    - success
    pipeline: graylog.build
    application: graylog2-server

  bump-graylog-deploy:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-deploy.bump
    application: GraylogDeploy

  bump-accounting:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotAccounting

  bump-alarm:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotAlarm

  bump-asn-finder:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotAsnFinder

  bump-consistency:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotConsistency

  bump-data-bot:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotDataBot

  bump-kefla:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotKefla

  bump-output-syslog:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotOutputSyslog

  bump-stream-router:
    depends_on:
    - build-graylog
    when:
    - success
    pipeline: graylog-plugin.bump
    application: ThotStreamRouter

metadata:
  default_tags: git.branch,git.author

notifications:
- type: vcs
  pipelines:
  - build-graylog
  settings:
    on_success: always

retention_policy: git_branch_exists == "true" AND run_days_before < 32

integrations:
  artifactory-ldp-default:
    type: artifact_manager
    config:
      build.info.path:
        type: string


