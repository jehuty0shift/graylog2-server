version: v1.0
name: graylog-plugin.build
description: Build given Graylog plugin
jobs:
- job: Build package
  steps:
  - artifactDownload:
      path: .
      tag: '{{.cds.version}}'
  - script:
    - apt-get update
    - apt-get install -y ca-certificates curl gnupg
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin        
  - script:
    - echo "${CDS_INTEGRATION_ARTIFACT_MANAGER_TOKEN}" | docker login --username ${CDS_INTEGRATION_ARTIFACT_MANAGER_TOKEN_NAME} --password-stdin ldp-default-docker.artifactory.ovhcloud.tools
    - mkdir graylog2-server
    - tar -xzf graylog2-server-build.tgz -C graylog2-server
    - rm graylog2-server-build.tgz
    - eval $(worker key install --env-git proj-ssh-logs)
    - git clone {{.git.url}} -b prod {{.cds.workspace}}/plugin
    - docker build -t ldp/graylog-plugin-build graylog2-server/docker/plugin/
    - docker run --network=host -v {{.cds.workspace}}:/data ldp/graylog-plugin-build
    - rm -rf plugin/target/original-*
  - artifactUpload:
      path: plugin/target/*.jar
      tag: '{{.cds.version}}'
  requirements:
  - region: pcidss
  - model: compute.pcidss/debian10
