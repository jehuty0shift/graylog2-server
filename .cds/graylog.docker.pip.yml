version: v1.0
name: graylog.docker
description: Package a Graylog image
jobs:
- job: Build package
  steps:
  - artifactDownload:
      path: .
      tag: '{{.cds.version}}'
  - script:
    - apt-get update
    - apt-get install -y ca-certificates curl gnupg
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update
    - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin        
  - script:
    - mkdir -p graylog2-server docker/plugins
    - tar -xzf graylog2-server-build.tgz -C graylog2-server
    - rm graylog2-server-build.tgz
    - cp -a graylog2-server/docker/custom/* docker
    - mv docker/asn.csv docker/plugins/
    - curl "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=9jK2aYhoI2xmgRyq&suffix=tar.gz" --output GeoLite2-City.tar.gz
    - tar -xvzf GeoLite2-City.tar.gz
    - mv GeoLite2-City*/*mmdb docker/plugins/GeoLite2-City.mmdb
    - mv graylog2-server/target/assembly/graylog-*.tar.gz docker/graylog.tar.gz
    - rm graylog2-server/graylog-storage-elasticsearch6/target/*tests.jar
    - rm graylog2-server/graylog-storage-elasticsearch7/target/*tests.jar
    - mv graylog2-server/graylog-storage-elasticsearch6/target/*.jar docker/plugins
    - mv graylog2-server/graylog-storage-elasticsearch7/target/*.jar docker/plugins
    - mv *.jar docker/plugins
    - ls -lh docker
  - CDS_DockerPackage:
      dockerRepositoryName: ldp-default-docker
      dockerfileDirectory: 'docker'
      enableBuildkit: "false"
      imageName: 'graylog-dk'
      imageTag: '{{.cds.version}}'    
  requirements:
  - region: pcidss
  - model: compute.pcidss/debian10
