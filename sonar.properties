ovh.companion.analyze=auto
ovh.companion.cds.project=LOGS
ovh.companion.cds.workflow=Graylog
ovh.companion.cds.memory=8000
ovh.companion.archive.artifact.download=target.tar.gz
#sonar.projectVersion=4.0.0-rc.2
sonar.java.source=11
sonar.java.jdkHome=./jdk17
sonar.log.level=INFO
sonar.sources=graylog2-server/src/main/java,graylog2-web-interface/src,graylog-storage-elasticsearch6/src/main/java,graylog-storage-elasticsearch7/src/main/java
#sonar.sources=graylog2-server/src/main/java,graylog-storage-elasticsearch6/src/main/java,graylog-storage-elasticsearch7/src/main/java
#sonar.sources=graylog-storage-elasticsearch6/src/main/java,graylog-storage-elasticsearch7/src/main/java
#sonar.language=java,js
sonar.javascript.file.suffixes=.js,.jsx
sonar.exclusions=**/*_test.go,**/vendor/**,docs/**,chart/**,.build/**,.cds/**,**/node_modules/**,**/*.spec.ts,chart/**,nginx/**
sonar.tests=graylog2-server/src/test/java,graylog-storage-elasticsearch6/src/test/java,graylog-storage-elasticsearch7/src/test/java
sonar.test.inclusions=**/*Test.java
#sonar.test.exclusions=**/Foo/**
#sonar.coverage.jacoco.xmlReportPaths=jacoco.xml
sonar.junit.reportPaths=./target/surefire-reports
sonar.java.libraries=./libGraylog/*.jar
sonar.java.binaries=graylog2-server/target/classes,graylog-storage-elasticsearch6/target/classes,graylog-storage-elasticsearch7/target/classes
sonar.java.test.binaries=graylog2-server/target/test-classes,graylog-storage-elasticsearch6/target/test-classes,graylog-storage-elasticsearch7/target/test-classes
ovh.companion.branches=*
ovh.companion.quality_gate=OVH way v1 with vulnerabilities
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Message.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1700
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Version.java


